steps:
  # Build the Docker image using the existing Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'apps/web'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz:latest'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cofarmz'
      - '--image'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz:latest'

options:
  logging: CLOUD_LOGGING_ONLY
