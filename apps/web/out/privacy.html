owers, and Notifications\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"3. Messages, Calls, Followers, and Notifications\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We process messages, conversation details, media shared in messages, read status, follower requests, follower status, calling preferences, call-contact actions, and notification tokens so users can communicate, receive booking updates, manage follower requests, and control who can contact them. Calling can be enabled or disabled from your profile. When calling is enabled, only accepted followers can call you unless another feature requires a booking-related contact.\"}]]}],[\"$\",\"div\",\"4. Location Information\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"4. Location Information\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"With your permission, we may collect precise or approximate location information from your device. We also store locations you enter manually for your profile, crops, equipment, and bookings. Location is used to show nearby farmers, buyers, suppliers, equipment, maps, distance estimates, and location-based recommendations. You can disable device location access in your device settings.\"}]]}],[\"$\",\"div\",\"5. Device, Usage, Cookies, and Analytics\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"5. Device, Usage, Cookies, and Analytics\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We may collect technical and usage information such as IP address, browser type, operating system, device identifiers, app version, session data, pages visited, features used, error logs, and performance data. We use cookies, local storage, Firebase, and analytics tools to keep you logged in, remember preferences, improve performance, understand usage, prevent abuse, and secure the service.\"}]]}],[\"$\",\"div\",\"6. How We Use Information\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"6. How We Use Information\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We use information to provide, personalize, and improve CoFarmz; create and manage accounts; display profiles and listings; enable reels, comments, likes, messages, calls, follows, bookings, reviews, maps, and notifications; recommend relevant users, crops, equipment, and content; verify mobile numbers; detect fraud or misuse; debug issues; maintain safety; and comply with legal obligations.\"}]]}],[\"$\",\"div\",\"7. Public and Shared Information\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"7. Public and Shared Information\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"Your profile name, role, profile photo, location, crops, equipment, reels, captions, comments, likes, followers/following counts, reviews, and other public or feature-visible information may be seen by other users. Messages are visible to the sender and receiver. Booking details are shared between the renter and the equipment owner as needed to complete the booking.\"}]]}],[\"$\",\"div\",\"8. How We Share Information\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"8. How We Share Information\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We do not sell your personal information. We may share information with other CoFarmz users when required by a feature, with trusted service providers that help us operate the platform, with payment or delivery partners if such features are enabled, with authorities when required by law, or when necessary to protect users, prevent fraud, enforce our terms, or respond to safety and security issues.\"}]]}],[\"$\",\"div\",\"9. Service Providers and Integrations\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"9. Service Providers and Integrations\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"CoFarmz may use third-party providers for hosting, database storage, cloud media storage, authentication, mobile verification, maps, analytics, push notifications, content delivery, email, and support. These providers may process information only to provide services to CoFarmz and are subject to their own privacy and security practices.\"}]]}],[\"$\",\"div\",\"10. Data Security\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"10. Data Security\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We use HTTPS/TLS encryption, password hashing, access controls, and other reasonable technical and organizational measures to protect your information. No system is completely secure, but we work to protect accounts, content, messages, media, and platform data from unauthorized access, disclosure, alteration, or misuse.\"}]]}],[\"$\",\"div\",\"11. Data Retention\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"11. Data Retention\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We keep information for as long as needed to provide CoFarmz, maintain account records, complete bookings, resolve disputes, improve safety, prevent fraud, comply with legal obligations, and enforce our terms. If you delete content or request account deletion, we will delete or anonymize information unless retention is required for security, legal, backup, dispute, or legitimate business reasons.\"}]]}],[\"$\",\"div\",\"12. Your Choices and Controls\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl fo rsonal information without proper consent, we will take appropriate steps to remove it.\"}]]}],[\"$\",\"div\",\"16. International Processing\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"16. International Processing\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"Your information may be stored and processed using servers, databases, cloud providers, and service providers located in India or other countries. Where required, we take appropriate steps to protect information when it is transferred or processed outside your region.\"}]]}],[\"$\",\"div\",\"17. Policy Updates\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"17. Policy Updates\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"We may update this Privacy Policy from time to time to reflect new features, legal requirements, security practices, or changes to CoFarmz. Updated versions will be posted on this page with the latest effective date.\"}]]}],[\"$\",\"div\",\"18. Contact Us\",{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-bold text-gray-900 mb-3\",\"children\":\"18. Contact Us\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 leading-8\",\"children\":\"If you have questions, concerns, complaints, or requests about this Privacy Policy or your data, please contact the CoFarmz Support Team using the official email or WhatsApp number shown below.\"}]]}]],[\"$\",\"div\",null,{\"className\":\"rounded-2xl bg-green-50 border border-green-200 p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold text-green-800 mb-2\",\"children\":\"Contact Information\"}],[\"$\",\"div\",null,{\"className\":\"space-y-2 text-gray-700\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Application:\"}],\" CoFarmz\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"chil
