steps:
  # Build using Dockerfile (NOT buildpack — buildpack fails with EOF on Cloud Build)
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'apps/web'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_URL=${_NEXT_PUBLIC_BACKEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend'

  # Deploy to Cloud Run (cofarmz-backend service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cofarmz-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/cofarmz-492212/cloud-run-source-deploy/cofarmz/cofarmz-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _NEXT_PUBLIC_BACKEND_URL: 'https://cofarmz-backend-866114557322.asia-south1.run.app'
  _NEXT_PUBLIC_APP_URL: 'https://cofarmz-backend-866114557322.asia-south1.run.app'
  _NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyAVQMDVcZtoVELw_XMkyxg-2JCZxe4ewVg'
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'cofarmz-492212.firebaseapp.com'
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'cofarmz-492212'
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'cofarmz-492212.firebasestorage.app'
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '866114557322'
  _NEXT_PUBLIC_FIREBASE_APP_ID: '1:866114557322:web:737c82ec52a23708326473'
  _NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-MBSF2PBW7Q'
