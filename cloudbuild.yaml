options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/app',
        '--build-arg', 'NEXT_PUBLIC_BACKEND_URL=${_NEXT_PUBLIC_BACKEND_URL}',
        '--build-arg', 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}',
        '--build-arg', 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}',
        'apps/web'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/app']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gcloud', 'run', 'deploy', 'cofarmz-backend',
        '--image', 'gcr.io/$PROJECT_ID/app',
        '--region', 'asia-south1',
        '--platform', 'managed',
        '--port', '8080',
        # Keep DATABASE_URL and any Firebase credentials already configured on
        # Cloud Run. --set-env-vars would remove variables not listed here.
        '--update-env-vars', 'ANNOUNCEMENT_SCHEDULER_SECRET=$BUILD_ID',
        '--allow-unauthenticated'
      ]

  # Repeated announcements are processed every five minutes. The API advances
  # each announcement according to its selected 1/3/6/12-hour frequency.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL="$(gcloud run services describe cofarmz-backend \
          --region=asia-south1 \
          --format='value(status.url)')"
        if [ -z "$$SERVICE_URL" ]; then
          echo "Unable to determine the deployed Cloud Run service URL" >&2
          exit 1
        fi

        if gcloud scheduler jobs describe cofarmz-announcement-scheduler --location=asia-south1 >/dev/null 2>&1; then
          gcloud scheduler jobs update http cofarmz-announcement-scheduler \
            --location=asia-south1 \
            --schedule="*/5 * * * *" \
            --time-zone="UTC" \
            --uri="$$SERVICE_URL/api/admin/announcements/process" \
            --http-method=POST \
            --update-headers="x-scheduler-secret=$BUILD_ID"
        else
          gcloud scheduler jobs create http cofarmz-announcement-scheduler \
            --location=asia-south1 \
            --schedule="*/5 * * * *" \
            --time-zone="UTC" \
            --uri="$$SERVICE_URL/api/admin/announcements/process" \
            --http-method=POST \
            --headers="x-scheduler-secret=$BUILD_ID"
        fi

substitutions:
